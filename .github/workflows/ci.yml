name: KillerBee CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore KillerBee.slnx
      - run: dotnet build KillerBee.slnx --no-restore --configuration Release
      - run: dotnet test tests/KillerBee.Tests --no-build --configuration Release --logger trx
      - name: Export SQL Server reference schema
        run: dotnet run --project src/KillerBee.Components --configuration Release --no-build -- --schema > database/generated-schema.sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence
          path: |
            **/TestResults/*.trx
            database/generated-schema.sql
